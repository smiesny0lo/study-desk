    <title>Semester Desk</title>
    <script>
      // Settings → Look, put on before anything is drawn so the page never flashes in the wrong colours.
      // state/look.ts does the same after a change; "Match device" follows the device's dark mode.
      (function () {
        var look = {};
        try { look = JSON.parse(localStorage.getItem("sd:look")) || {}; } catch (e) {}
        var r = document.documentElement, dark = matchMedia("(prefers-color-scheme: dark)").matches;
        r.dataset.theme = look.theme === "light" || look.theme === "dark" ? look.theme : dark ? "dark" : "light";
        r.dataset.bg = look.bg || "cool";
        r.dataset.contrast = look.contrast || "standard";
        if (look.accent | 0) r.style.setProperty("--hue", "var(--c" + (look.accent | 0) + ")");
      })();
    </script>
